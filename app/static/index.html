<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="StudyForge — учебная рабочая область для PDF, конспектов, карточек и тестов.">
  <title>StudyForge — учебная рабочая область</title>
  <link rel="icon" type="image/svg+xml" href="/mark.svg">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">К основному содержимому</a>
  <div class="shell">
    <aside class="sidebar">
      <a href="#dashboard" class="brand">
        <img src="/mark.svg" width="38" height="38" alt="">
        <span>StudyForge<small>Учебная рабочая область</small></span>
      </a>
      <nav id="navigation" aria-label="Основные разделы"></nav>
      <div class="side-bottom">
        <div id="quota"></div>
        <div class="workspace"><span class="avatar" aria-hidden="true">S</span><span>Личная область<small>Локальная сессия</small></span></div>
      </div>
    </aside>
    <div class="workspace-main">
      <header class="topbar">
        <div class="breadcrumb"><span>Рабочая область</span><span aria-hidden="true">/</span><strong id="crumb">Обзор</strong></div>
        <div class="toolbar"><div id="mode" hidden></div><button id="theme" class="icon-button" type="button"></button></div>
      </header>
      <main id="main" tabindex="-1">
        <div class="skeleton" aria-label="Загрузка рабочей области" role="status"></div>
      </main>
    </div>
  </div>
  <div id="toasts" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="modal" aria-labelledby="dialog-title">
    <div id="dialog-content"></div>
  </dialog>
</body>
</html>
